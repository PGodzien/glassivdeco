<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#07090d">
  <title>GlassivDeco — Katalog produktowy</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@300;400;500;600;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{--bg:#07090d;--ink:#f7f7f4;--muted:#a9acb2;--gold:#d7b66d;--line:rgba(255,255,255,.14);--surface:#111318}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Figtree",sans-serif}button{font:inherit}
    .deck{position:fixed;inset:0}.slide{position:absolute;inset:0;padding:6vh 5vw 11vh;opacity:0;visibility:hidden;transform:translateX(2.5%);transition:opacity .35s ease,transform .42s ease,visibility .42s;overflow:hidden}.slide.active{opacity:1;visibility:visible;transform:none;z-index:2}.slide.leaving{transform:translateX(-2%)}
    h1,h2,h3{font-family:"Syncopate",sans-serif;text-transform:uppercase;margin:0;letter-spacing:-.035em}p{margin:0}.gold{color:var(--gold)}
    .logo{position:absolute;right:4vw;top:3.6vh;width:min(12vw,170px);z-index:5}.logo img{display:block;width:100%}
    .pill{display:inline-flex;align-items:center;width:max-content;max-width:100%;padding:9px 15px;border:1px solid var(--line);border-radius:999px;font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#d6d7da;background:rgba(7,9,13,.72)}
    .pill.gold-pill{border-color:rgba(215,182,109,.55);color:var(--gold)}
    .cover{display:grid;grid-template-columns:52% 48%;align-items:center;padding-right:0}.cover-copy{position:relative;z-index:2}.cover h1{font-size:clamp(40px,4.55vw,74px);line-height:.98;margin:4vh 0 3vh}.cover p{max-width:580px;color:var(--muted);font-size:clamp(16px,1.35vw,22px);line-height:1.55}.cover-photo{height:100vh;overflow:hidden}.cover-photo img{width:100%;height:100%;object-fit:cover;object-position:center}
    .intro{display:grid;grid-template-columns:50% 50%;padding-right:0}.intro-copy{align-self:center;padding-right:5vw}.intro h2{font-size:clamp(30px,3.35vw,54px);line-height:1.12;margin:4vh 0 3vh}.intro p{color:#c2c4c9;font-size:clamp(15px,1.2vw,20px);line-height:1.62;max-width:650px}.pills{display:flex;flex-wrap:wrap;gap:9px;margin-top:4vh}.intro-image{height:100vh;overflow:hidden}.intro-image img{width:100%;height:100%;object-fit:cover}
    .gallery{display:flex;flex-direction:column}.gallery-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2.5vh;padding-right:13vw}.gallery-head h2{font-size:clamp(19px,2.25vw,37px);line-height:1.15;max-width:900px}.gallery-head .meta{color:var(--muted);font-size:12px;white-space:nowrap}
    .grid{flex:1;min-height:0;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);gap:12px}.shot{position:relative;overflow:hidden;border-radius:18px;background:#ecebea}.shot img{width:100%;height:100%;display:block;object-fit:cover}.shot .pill{position:absolute;left:14px;bottom:14px;z-index:2;color:white;background:rgba(4,5,8,.78);backdrop-filter:blur(8px);border-color:rgba(255,255,255,.24);font-size:9px;padding:7px 11px}.shot:after{content:"";position:absolute;inset:55% 0 0;background:linear-gradient(transparent,rgba(0,0,0,.45));pointer-events:none}
    .nav{position:fixed;left:0;right:0;bottom:0;height:8.5vh;z-index:10;display:flex;align-items:center;gap:13px;padding:0 4vw;background:linear-gradient(transparent,rgba(7,9,13,.94))}.counter{font-size:12px;letter-spacing:.14em;min-width:74px}.counter span{color:#73767d}.progress{height:1px;background:rgba(255,255,255,.17);flex:1}.progress i{display:block;height:1px;background:var(--gold);transition:width .35s}.nav-btn{height:42px;min-width:42px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:rgba(7,9,13,.85);color:white;cursor:pointer}.nav-btn:hover{border-color:var(--gold);color:var(--gold)}
    @media(max-width:850px){.slide{padding:7vh 5vw 13vh;overflow:auto}.logo{width:120px}.cover,.intro{display:block;padding-right:5vw}.cover-copy,.intro-copy{position:relative;z-index:2;max-width:82%;padding-top:10vh}.cover-photo,.intro-image{position:absolute;inset:0;opacity:.34}.cover-photo:after,.intro-image:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,var(--bg) 20%,transparent)}.grid{grid-template-columns:repeat(2,1fr);grid-template-rows:repeat(3,minmax(180px,1fr))}.gallery-head{padding-right:0}.shot{border-radius:14px}}
    @media(max-width:560px){.slide{padding-top:8vh}.cover-copy,.intro-copy{max-width:100%}.cover h1{font-size:10vw}.intro h2{font-size:8.5vw}.gallery-head{align-items:flex-start;gap:12px}.gallery-head .meta{font-size:10px}.grid{gap:7px}.shot{border-radius:10px}.shot .pill{left:8px;bottom:8px;font-size:7px;padding:5px 8px}.logo{top:2.5vh;right:5vw;width:100px}.nav-btn{padding:0 11px}}
  </style>
</head>
<body>
  <main class="deck" id="deck"><div class="logo"><img src="/logoglassivdeco-white.svg" alt="GlassivDeco"></div></main>
  <nav class="nav" aria-label="Nawigacja katalogu"><div class="counter"><b id="current">01</b> <span>— <span id="total">01</span></span></div><div class="progress"><i id="bar"></i></div><button class="nav-btn" id="prev" aria-label="Poprzedni slajd">←</button><button class="nav-btn" id="next" aria-label="Następny slajd">→</button><button class="nav-btn" id="full" aria-label="Pełny ekran">⛶</button></nav>
  <script>
    const technologies={
      mineral:{order:1,title:'Sitodruk farbami mineralnymi',short:'Sitodruk mineralny',description:'Zdobienie opakowań szklanych sitodrukiem przy użyciu farb mineralnych daje szerokie możliwości estetyczne. Farba mineralna jest nieagresywna, nietrująca i nieszkodliwa dla środowiska, a zarazem odporna chemicznie i mechanicznie.',pills:['23 produkty','Precyzyjny detal','Odporność chemiczna i mechaniczna'],hero:'001-01'},
      uv:{order:2,title:'Technologia organiczna / UV',short:'Organiczna / UV',description:'Farby utwardzane światłem UV pozwalają pracować z rozbudowaną paletą barw i złożonym detalem graficznym. Technologia daje dużą swobodę projektową i sprawdza się w wyrazistych, współczesnych realizacjach.',pills:['12 produktów','Bogata paleta kolorów','Złożona grafika'],hero:'043-01'},
      organic:{order:3,title:'Technologia organiczna',short:'Technologia organiczna',description:'Pokrywanie całych opakowań kolorem litym, przezroczystym lub transparentnym pozwala budować charakterystyczną powierzchnię produktu oraz uzyskać efekt satynowania albo intensywnego koloru.',pills:['4 produkty','Pełne pokrycie','Kolor lity i transparentny'],hero:'029-01'},
      combined:{order:4,title:'Technologia mineralna / sitodruk farbami mineralnymi',short:'Mineralna + sitodruk',description:'Połączenie pokrywania powierzchni i sitodruku pozwala budować wielowarstwowy efekt. Tło nadaje opakowaniu charakter, a nadruk prowadzi komunikację marki i eksponuje najważniejszy detal.',pills:['6 produktów','Efekt wielowarstwowy','Powierzchnia i detal'],hero:'015-01'}
    };
    const products=[
      ['001','Butelki Pepsi','mineral',3],['002','Czerwone butelki — seria specjalna','uv',6],['003','Szkło Wodne','mineral',3],['004','Malina','mineral',2],['005','Mirinda','mineral',3],['006','Pepsi-Cola','mineral',1],['007','Wyborowa','mineral',2],['008','Krakus Polish Vodka','mineral',2],['009','Brązowa butelka','organic',1],['010','Czarne prostokątne butelki','organic',2],['011','Smirnoff','mineral',2],['012','Dekorowane szkło Białystok','mineral',2],['013','Sam Pan Boh','uv',2],['014','Herbert','mineral',1],['015','Le Grand','combined',3],['016','Biała butelka z zielonym detalem','mineral',2],['017','Palace Vodka Pepper','combined',3],['018','Kolekcja małych butelek','mineral',3],['019','Biała butelka z motywem miecza','combined',2],['020','Porter','mineral',1],['021','JML Cognac','mineral',2],['022','Pirate Tango','mineral',2],['023','Biała butelka z grafiką','combined',2],['024','Kolekcja małych słoiczków','mineral',4],['025','Dyfuzor Aroma','mineral',2],['026','Brain Health','mineral',2],['027','Aro','uv',3],['028','Pravda','mineral',1],['029','Niebieska smukła butelka','organic',1],['030','Butelki do zapachów','uv',3],['031','Ciemnoczerwone butelki','uv',2],['032','Butelki suplementów','mineral',1],['033','Seria Voda','uv',9],['034','Butelka z motywem matrioszki','combined',2],['035','Granat Rozrywkowy','combined',2],['036','Czarny Porter','mineral',1],['037','Zielona butelka wody','uv',2],['038','PBO Vodka','uv',2],['039','Wódka Podrzucia','uv',2],['040','Drop of Perfect','mineral',2],['041','Zestaw małych opakowań','mineral',1],['042','Wonders','uv',2],['043','Seria Lekko','uv',5],['044','Słoiczki kosmetyczne','organic',1],['045','Rum','uv',1]
    ];
    const deck=document.getElementById('deck');
    const imagePath=key=>`/catalog/all/product-${key}.jpg`;
    const slide=className=>{const el=document.createElement('section');el.className=`slide ${className}`;deck.appendChild(el);return el};
    const cover=slide('cover');cover.innerHTML=`<div class="cover-copy"><span class="pill gold-pill">Katalog produktowy / 2026</span><h1>Zdobnictwo<br><span class="gold">szklanych</span><br>opakowań</h1><p>Kompletny przegląd 45 produktów i 103 zdjęć uporządkowanych według zastosowanej technologii.</p></div><div class="cover-photo"><img src="${imagePath('033-01')}" alt="Dekorowane opakowania szklane"></div>`;
    Object.entries(technologies).sort((a,b)=>a[1].order-b[1].order).forEach(([key,tech])=>{
      const intro=slide('intro');intro.innerHTML=`<div class="intro-copy"><span class="pill gold-pill">${String(tech.order).padStart(2,'0')} / Technologia</span><h2>${tech.title}</h2><p>${tech.description}</p><div class="pills">${tech.pills.map(x=>`<span class="pill">${x}</span>`).join('')}</div></div><div class="intro-image"><img src="${imagePath(tech.hero)}" alt="${tech.title}"></div>`;
      const shots=products.filter(p=>p[2]===key).flatMap(([id,name,,count])=>Array.from({length:count},(_,i)=>({id,name,src:imagePath(`${id}-${String(i+1).padStart(2,'0')}`)})));
      for(let page=0;page<Math.ceil(shots.length/6);page++){
        const pageShots=shots.slice(page*6,page*6+6),gallery=slide('gallery');
        gallery.innerHTML=`<div class="gallery-head"><div><span class="pill gold-pill">${String(tech.order).padStart(2,'0')} / Realizacje</span><h2>${tech.short}</h2></div><span class="meta">${page*6+1}–${page*6+pageShots.length} / ${shots.length} zdjęć</span></div><div class="grid">${pageShots.map(s=>`<article class="shot"><img src="${s.src}" alt="${s.name}"><span class="pill">${s.name}</span></article>`).join('')}</div>`;
      }
    });
    const slides=[...document.querySelectorAll('.slide')],current=document.getElementById('current'),total=document.getElementById('total'),bar=document.getElementById('bar');let index=0,startX=0;total.textContent=String(slides.length).padStart(2,'0');
    function show(n){const old=index;index=Math.max(0,Math.min(slides.length-1,n));if(old!==index){slides[old].classList.remove('active');slides[old].classList.add('leaving');setTimeout(()=>slides[old].classList.remove('leaving'),440)}slides[index].classList.add('active');current.textContent=String(index+1).padStart(2,'0');bar.style.width=((index+1)/slides.length*100)+'%'}
    document.getElementById('next').onclick=()=>show(index+1);document.getElementById('prev').onclick=()=>show(index-1);document.getElementById('full').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
    addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(index+1)}if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(index-1)}if(e.key==='Home')show(0);if(e.key==='End')show(slides.length-1)});addEventListener('touchstart',e=>startX=e.touches[0].clientX,{passive:true});addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-startX;if(Math.abs(d)>55)show(index+(d<0?1:-1))},{passive:true});show(0);
  </script>
</body>
</html>
